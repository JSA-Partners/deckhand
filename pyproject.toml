[project]
name = "deckhand"
version = "5.1.2"
description = "A story process for shipping code with Claude Code and superpowers"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9",
    "pymarkdownlnt>=0.9",
    "gitlint-core>=0.19",
    "pre-commit>=4",
    "ruff>=0.14",
    "hypothesis>=6.170.15",
]

[tool.ruff]
# The launcher carries a shebang instead of an extension, and ruff finds files by name.
extend-include = ["bin/deckhand"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pymarkdown]
plugins.md013.enabled = false
plugins.md024.enabled = false
extensions.front-matter.enabled = true
