name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - name: Install the dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Markdown
        run: uv run pymarkdown scan -r skills agents README.md CONTRIBUTING.md CLAUDE.md
