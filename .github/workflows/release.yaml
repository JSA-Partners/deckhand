name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please bumps pyproject.toml but not the lock, which records the project's own version.
      # Its pr output is set only when it changed the pull request, so the open one is looked up by label.
      - name: Find the release pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Check out the release pull request
        if: ${{ steps.find.outputs.branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.find.outputs.branch }}
      - name: Install uv and Python
        if: ${{ steps.find.outputs.branch }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - name: Record the release version in uv.lock
        if: ${{ steps.find.outputs.branch }}
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -q -m "build: record the release version in uv.lock" -- uv.lock
            git push
          fi
